[project]
name = "hmm-markov"
version = "1.0.0"
description = "Markov chains and hidden Markov models from scratch: rain spells and isolated-word recognition, validated on held-out data."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pierre Chambet", email = "pierrechambet@gmail.com" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
]

[project.scripts]
hmm-markov = "hmm_markov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hmm_markov"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["coursework"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
